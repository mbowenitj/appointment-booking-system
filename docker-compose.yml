services:
  # ── Backend (Node.js + Express + SQLite) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appointease-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_DIR: /data
      # To restrict CORS to your actual domain, set this:
      # CORS_ORIGIN: https://yourdomain.com
    volumes:
      - db_data:/data        # Persist the SQLite file across restarts
    expose:
      - "3001"               # Internal only — nginx proxies to it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (React/Vite built → nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appointease-frontend
    restart: unless-stopped
    ports:
      - "3000:80"            # App is available at http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    driver: local
