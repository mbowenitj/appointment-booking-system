services:
  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bookeasy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bookeasy
      POSTGRES_USER:     bookeasy
      POSTGRES_PASSWORD: bookeasy_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookeasy -d bookeasy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js + Express + PostgreSQL) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookeasy-backend
    restart: unless-stopped
    environment:
      NODE_ENV:     production
      PORT:         3001
      DATABASE_URL: postgresql://bookeasy:bookeasy_secret@postgres:5432/bookeasy
      # To restrict CORS to your actual domain, set this:
      # CORS_ORIGIN: https://yourdomain.com
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (React/Vite built → nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookeasy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
    driver: local
